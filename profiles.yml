data_quality_showcase:
  target: dev
  outputs:
    dev:
      type: sqlite
      threads: 1
      database: "database"        # SQLite database file name (no .db extension needed)
      schema: "main"              # SQLite uses 'main' as the default schema
      schemas_and_paths:
        main: "{{ env_var('DBT_PROFILES_DIR', '~/.dbt') }}/data_quality.db"